<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">TraderIO — Safety Gates and Rotation</title>
<desc id="d">Left: five independent gates an order must pass, from the router's dry-run flag through the filter rules, rotation eligibility, the AddOn's account allowlist and the AddOn's own dry-run, with the last two living in NinjaTrader where the service cannot change them. Right: how rotation picks an account, hard gates first, then a weighted score of renewal urgency, progress to target, drawdown headroom, session activity and an inactivity deadline that saturates at the limit.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7784"/></marker>
  <style>
    .ig-title{font:700 44px "Space Grotesk",Inter,system-ui,sans-serif;fill:#E8ECEF;letter-spacing:-.02em}
    .ig-eyebrow{font:500 15px "JetBrains Mono",ui-monospace,monospace;fill:#F2A541;letter-spacing:.1em}
    .ig-grp{font:700 14px "JetBrains Mono",ui-monospace,monospace;fill:#F2A541;letter-spacing:.1em}
    .ig-num{font:700 15px "JetBrains Mono",ui-monospace,monospace;fill:#F2A541;letter-spacing:.08em}
    .ig-name{font:700 20px "Space Grotesk",Inter,system-ui,sans-serif;fill:#E8ECEF}
    .ig-note{font:400 15px Inter,system-ui,sans-serif;fill:#B8C2CC}
    .ig-item{font:400 15px Inter,system-ui,sans-serif;fill:#D5DCE3}
    .ig-cap{font:400 15px "JetBrains Mono",ui-monospace,monospace;fill:#9AA5AF}
    .ig-badge{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#0F1419;letter-spacing:.1em}
    .ig-card{fill:#161D25;stroke:#2A3540;stroke-width:1.5}
    .ig-card-hi{fill:#161D25;stroke:#F2A541;stroke-width:2.5}
    .ig-link{fill:none;stroke:#6B7784;stroke-width:2;marker-end:url(#arrow)}
    .ig-ext{fill:#0F1419;stroke:#4A5661;stroke-width:1.5;stroke-dasharray:6 5}
    .ig-bar{fill:#F2A541}
    .ig-track{fill:#2A3540}
  </style>
</defs>
<rect width="1600" height="900" fill="#0F1419"/>
<text class="ig-eyebrow" x="80" y="78">TRADERIO · WHAT STOPS A BAD ORDER, WHAT PICKS A GOOD ACCOUNT</text>
<text class="ig-title" x="80" y="132">TraderIO — Safety Gates and Rotation</text>
<text class="ig-note" x="80" y="172" style="font-size:18px">Real money moves here, so the design assumes every component can be wrong and makes the gates independent of each other.</text>

<!-- LEFT: gates column -->
<text class="ig-grp" x="80" y="230">FIVE INDEPENDENT GATES · AN ORDER MUST PASS ALL OF THEM</text>
<g>
  <rect class="ig-card" x="80" y="250" width="640" height="78" rx="12"/>
  <text class="ig-num" x="104" y="282">GATE 1 · ROUTER</text>
  <text class="ig-name" x="104" y="310">DRY_RUN=true</text>
  <text class="ig-note" x="330" y="282">The default. Orders are logged, never sent.</text>
  <text class="ig-note" x="330" y="304">Nothing reaches a broker until it is turned off.</text>
</g>
<path class="ig-link" d="M400 334v16"/>
<g>
  <rect class="ig-card" x="80" y="356" width="640" height="78" rx="12"/>
  <text class="ig-num" x="104" y="388">GATE 2 · ROUTER</text>
  <text class="ig-name" x="104" y="416">Filter rules</text>
  <text class="ig-note" x="330" y="388">Signals you do not want to trade at all:</text>
  <text class="ig-note" x="330" y="410">direction, symbol, any field, time-of-day windows.</text>
</g>
<path class="ig-link" d="M400 440v16"/>
<g>
  <rect class="ig-card" x="80" y="462" width="640" height="78" rx="12"/>
  <text class="ig-num" x="104" y="494">GATE 3 · ROUTER</text>
  <text class="ig-name" x="104" y="522">Rotation eligibility</text>
  <text class="ig-note" x="330" y="494">Paused, breached, capped, at a daily limit,</text>
  <text class="ig-note" x="330" y="516">already holding, or not executable: skipped.</text>
</g>
<path class="ig-link" d="M400 546v16"/>
<g>
  <rect class="ig-ext" x="80" y="568" width="640" height="78" rx="12"/>
  <text class="ig-num" x="104" y="600">GATE 4 · NINJATRADER</text>
  <text class="ig-name" x="104" y="628">Account allowlist</text>
  <text class="ig-note" x="330" y="600">Any account not ticked inside NinjaTrader.</text>
  <text class="ig-note" x="330" y="622">The service cannot change this list.</text>
</g>
<path class="ig-link" d="M400 652v16"/>
<g>
  <rect class="ig-ext" x="80" y="674" width="640" height="78" rx="12"/>
  <text class="ig-num" x="104" y="706">GATE 5 · NINJATRADER</text>
  <text class="ig-name" x="104" y="734">AddOn dryRun</text>
  <text class="ig-note" x="330" y="706">Everything, on the NinjaTrader side. Ships</text>
  <text class="ig-note" x="330" y="728">disabled, dry-run on, empty allowlist.</text>
</g>
<text class="ig-cap" x="80" y="790">Dashed boxes live in NinjaTrader, outside the service's reach, by design.</text>
<text class="ig-cap" x="80" y="814">A FLATTEN ALL kill switch in the AddOn window asks before acting.</text>

<!-- RIGHT: rotation -->
<text class="ig-grp" x="800" y="230">ROTATION · WHICH ACCOUNT TAKES THE TRADE</text>
<g>
  <rect class="ig-card" x="800" y="250" width="720" height="130" rx="12"/>
  <text class="ig-num" x="824" y="282">STEP 1 · HARD GATES</text>
  <text class="ig-name" x="824" y="310">Ineligible accounts are removed, not ranked</text>
  <text class="ig-item" x="824" y="340">Paused · phase filtered out · drawdown breached · daily loss or profit limit hit ·</text>
  <text class="ig-item" x="824" y="362">contract cap below order size · evaluation already at target · executor refuses it</text>
</g>
<path class="ig-link" d="M1160 386v16"/>
<g>
  <rect class="ig-card-hi" x="800" y="408" width="720" height="300" rx="12"/>
  <rect x="824" y="424" width="214" height="22" rx="11" fill="#F2A541"/>
  <text class="ig-badge" x="836" y="440">STEP 2 · WEIGHTED SCORE</text>
  <text class="ig-name" x="824" y="478">Among eligible accounts, the highest score wins</text>

  <text class="ig-item" x="824" y="516">Inactivity deadline (5 trading days)</text>
  <rect class="ig-track" x="1160" y="504" width="330" height="12" rx="6"/><rect class="ig-bar" x="1160" y="504" width="330" height="12" rx="6"/>
  <text class="ig-item" x="824" y="552">Evaluation renewal urgency</text>
  <rect class="ig-track" x="1160" y="540" width="330" height="12" rx="6"/><rect class="ig-bar" x="1160" y="540" width="250" height="12" rx="6"/>
  <text class="ig-item" x="824" y="588">Progress toward profit target</text>
  <rect class="ig-track" x="1160" y="576" width="330" height="12" rx="6"/><rect class="ig-bar" x="1160" y="576" width="210" height="12" rx="6"/>
  <text class="ig-item" x="824" y="624">Drawdown headroom</text>
  <rect class="ig-track" x="1160" y="612" width="330" height="12" rx="6"/><rect class="ig-bar" x="1160" y="612" width="180" height="12" rx="6"/>
  <text class="ig-item" x="824" y="660">Least traded this session</text>
  <rect class="ig-track" x="1160" y="648" width="330" height="12" rx="6"/><rect class="ig-bar" x="1160" y="648" width="140" height="12" rx="6"/>
  <text class="ig-cap" x="824" y="694">Bars show relative weight at full urgency, not fixed values.</text>
</g>
<text class="ig-cap" x="800" y="742">Scoring is pure and does no I/O, so it is fully unit-tested. Hovering a score</text>
<text class="ig-cap" x="800" y="766">in the dashboard shows the full breakdown.</text>
<text class="ig-cap" x="800" y="802">The inactivity factor escalates 0 → 0.2 → 0.4 → 0.6 and then saturates: accounts</text>
<text class="ig-cap" x="800" y="826">already past the deadline are equally in breach and need a person, not a queue.</text>
</svg>
