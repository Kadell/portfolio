<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">TraderIO — The Signal Path</title>
<desc id="d">Seven stages from a TradingView alert to a NinjaTrader order: alert over a Cloudflare tunnel that publishes one path, webhook authentication that answers 200 at once, a fail-closed parser, declarative rules, account rotation, the broker seam, and the NinjaTrader Receiver AddOn. A Sync AddOn feeds account state back into rotation, and Google Sheets logging sits off the order path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7784"/></marker>
  <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A541"/></marker>
  <style>
    .ig-title{font:700 44px "Space Grotesk",Inter,system-ui,sans-serif;fill:#E8ECEF;letter-spacing:-.02em}
    .ig-eyebrow{font:500 15px "JetBrains Mono",ui-monospace,monospace;fill:#F2A541;letter-spacing:.1em}
    .ig-num{font:700 15px "JetBrains Mono",ui-monospace,monospace;fill:#F2A541;letter-spacing:.08em}
    .ig-name{font:700 21px "Space Grotesk",Inter,system-ui,sans-serif;fill:#E8ECEF}
    .ig-note{font:400 15px Inter,system-ui,sans-serif;fill:#B8C2CC}
    .ig-cap{font:400 16px "JetBrains Mono",ui-monospace,monospace;fill:#9AA5AF}
    .ig-badge{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#0F1419;letter-spacing:.1em}
    .ig-card{fill:#161D25;stroke:#2A3540;stroke-width:1.5}
    .ig-card-hi{fill:#161D25;stroke:#F2A541;stroke-width:2.5}
    .ig-link{fill:none;stroke:#6B7784;stroke-width:2;marker-end:url(#arrow)}
    .ig-loop{fill:none;stroke:#F2A541;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow-hi)}
    .ig-ext{fill:#0F1419;stroke:#4A5661;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
</defs>
<rect width="1600" height="900" fill="#0F1419"/>
<text class="ig-eyebrow" x="80" y="78">TRADERIO · ONE ALERT, START TO FINISH</text>
<text class="ig-title" x="80" y="132">TraderIO — The Signal Path</text>
<text class="ig-note" x="80" y="172" style="font-size:18px">A TradingView alert becomes a protected futures order on the account that can best take it. Nothing slow sits on the order path.</text>

<!-- Row 1: x = 80 + i*295, w=250, y=230, h=170 -->
<g>
  <rect class="ig-ext" x="80" y="230" width="250" height="170" rx="12"/>
  <text class="ig-num" x="104" y="262">01 · SOURCE</text>
  <text class="ig-name" x="104" y="296">TradingView</text>
  <text class="ig-name" x="104" y="322">Alert</text>
  <text class="ig-note" x="104" y="352">Strategy fires a webhook:</text>
  <text class="ig-note" x="104" y="372">entry text blob or exit JSON</text>
</g>
<line class="ig-link" x1="336" y1="315" x2="368" y2="315"/>
<g>
  <rect class="ig-card" x="375" y="230" width="250" height="170" rx="12"/>
  <text class="ig-num" x="399" y="262">02</text>
  <text class="ig-name" x="399" y="296">Cloudflare</text>
  <text class="ig-name" x="399" y="322">Tunnel</text>
  <text class="ig-note" x="399" y="352">Publishes exactly one path.</text>
  <text class="ig-note" x="399" y="372">Everything else: 404 at the edge</text>
</g>
<line class="ig-link" x1="631" y1="315" x2="663" y2="315"/>
<g>
  <rect class="ig-card" x="670" y="230" width="250" height="170" rx="12"/>
  <text class="ig-num" x="694" y="262">03</text>
  <text class="ig-name" x="694" y="296">Webhook</text>
  <text class="ig-name" x="694" y="322">Receiver</text>
  <text class="ig-note" x="694" y="352">Shared secret. Answers 200</text>
  <text class="ig-note" x="694" y="372">at once, works in background</text>
</g>
<line class="ig-link" x1="926" y1="315" x2="958" y2="315"/>
<g>
  <rect class="ig-card" x="965" y="230" width="250" height="170" rx="12"/>
  <text class="ig-num" x="989" y="262">04</text>
  <text class="ig-name" x="989" y="296">Parser</text>
  <text class="ig-note" x="989" y="352">Fails closed: an unreadable</text>
  <text class="ig-note" x="989" y="372">payload is logged, never guessed</text>
</g>
<line class="ig-link" x1="1221" y1="315" x2="1253" y2="315"/>
<g>
  <rect class="ig-card" x="1260" y="230" width="250" height="170" rx="12"/>
  <text class="ig-num" x="1284" y="262">05</text>
  <text class="ig-name" x="1284" y="296">Rules</text>
  <text class="ig-note" x="1284" y="332">Declarative YAML: direction,</text>
  <text class="ig-note" x="1284" y="352">symbols, time windows. Re-read</text>
  <text class="ig-note" x="1284" y="372">per signal; first failure logged</text>
</g>

<!-- turn down from 05 to 06 -->
<path class="ig-link" d="M1385 406v62"/>

<!-- Row 2 (right to left): y=475, h=170 -->
<g>
  <rect class="ig-card-hi" x="1260" y="475" width="250" height="170" rx="12"/>
  <rect x="1284" y="491" width="118" height="22" rx="11" fill="#F2A541"/>
  <text class="ig-badge" x="1296" y="507">06 · DECIDES</text>
  <text class="ig-name" x="1284" y="548">Account</text>
  <text class="ig-name" x="1284" y="574">Rotation</text>
  <text class="ig-note" x="1284" y="604">Hard gates refuse unsafe accounts;</text>
  <text class="ig-note" x="1284" y="624">a weighted score ranks the rest</text>
</g>
<line class="ig-link" x1="1253" y1="560" x2="1221" y2="560"/>
<g>
  <rect class="ig-card" x="965" y="475" width="250" height="170" rx="12"/>
  <text class="ig-num" x="989" y="507">07</text>
  <text class="ig-name" x="989" y="541">Broker Seam</text>
  <text class="ig-note" x="989" y="577">Broker-agnostic TradeIntent:</text>
  <text class="ig-note" x="989" y="597">entry, exit, breakeven, flatten.</text>
  <text class="ig-note" x="989" y="617">Backend is a config flag</text>
</g>
<line class="ig-link" x1="958" y1="560" x2="926" y2="560"/>
<g>
  <rect class="ig-ext" x="670" y="475" width="250" height="170" rx="12"/>
  <text class="ig-num" x="694" y="507">08 · EXECUTION</text>
  <text class="ig-name" x="694" y="541">NinjaTrader</text>
  <text class="ig-name" x="694" y="567">Receiver AddOn</text>
  <text class="ig-note" x="694" y="597">Market entry + protective stop,</text>
  <text class="ig-note" x="694" y="617">partial exits, breakeven, flatten</text>
</g>
<line class="ig-link" x1="663" y1="560" x2="631" y2="560"/>
<g>
  <rect class="ig-ext" x="375" y="475" width="250" height="170" rx="12"/>
  <text class="ig-num" x="399" y="507">09 · FEEDBACK</text>
  <text class="ig-name" x="399" y="541">NinjaTrader</text>
  <text class="ig-name" x="399" y="567">Sync AddOn</text>
  <text class="ig-note" x="399" y="597">Read-only snapshots: balances,</text>
  <text class="ig-note" x="399" y="617">positions, orders, executions</text>
</g>
<line class="ig-link" x1="368" y1="560" x2="336" y2="560"/>
<g>
  <rect class="ig-card" x="80" y="475" width="250" height="170" rx="12"/>
  <text class="ig-num" x="104" y="507">10</text>
  <text class="ig-name" x="104" y="541">Account</text>
  <text class="ig-name" x="104" y="567">Registry</text>
  <text class="ig-note" x="104" y="597">Positions, drawdown, session</text>
  <text class="ig-note" x="104" y="617">trades. The feed is authoritative</text>
</g>

<!-- feedback loop: registry back up to rotation -->
<path class="ig-loop" d="M205 651v60h1180v-60"/>
<text class="ig-cap" x="560" y="736">account state corrects ownership, drawdown and trade counts before the next signal is routed</text>

<!-- off-path logging -->
<g>
  <rect class="ig-ext" x="80" y="770" width="1430" height="92" rx="12"/>
  <text class="ig-num" x="104" y="800">OFF THE ORDER PATH</text>
  <text class="ig-note" x="104" y="824">Google Sheets audit log and trade log, a daily recap email at the close, and the live dashboard.</text>
  <text class="ig-note" x="104" y="846">Forwarding happens before any Sheets write and logging is queued off-thread, so nothing that touches Google can delay an order.</text>
</g>
</svg>
